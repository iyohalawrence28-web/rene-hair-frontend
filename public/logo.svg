<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;family=Cormorant+Garamond:wght@400;600&amp;display=swap');
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c49a"/>
      <stop offset="50%" style="stop-color:#C9956A"/>
      <stop offset="100%" style="stop-color:#b07d52"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c49a"/>
      <stop offset="100%" style="stop-color:#9a6a3a"/>
    </linearGradient>
  </defs>

  <!-- Crown icon -->
  <g transform="translate(38, 8) scale(0.72)">
    <!-- Crown base band -->
    <rect x="4" y="52" width="72" height="10" rx="2" fill="url(#crownGrad)"/>
    <!-- Crown points -->
    <polygon points="40,4 52,36 68,16 62,52 18,52 12,16 28,36" fill="url(#crownGrad)"/>
    <!-- Crown jewel dots -->
    <circle cx="40" cy="6" r="4" fill="#C9956A"/>
    <circle cx="68" cy="18" r="3.5" fill="#C9956A"/>
    <circle cx="12" cy="18" r="3.5" fill="#C9956A"/>
    <!-- Dark band on crown -->
    <rect x="4" y="46" width="72" height="6" rx="1" fill="#8B5A2A" opacity="0.5"/>
  </g>

  <!-- Ms.Fabulux — hot pink, serif bold -->
  <text
    x="24"
    y="105"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    font-style="italic"
    fill="#E8006C"
    letter-spacing="-1"
  >Ms.Fabulux</text>

  <!-- Decorative lines + hairs -->
  <line x1="24" y1="118" x2="148" y2="118" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <text
    x="152"
    y="128"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="400"
    fill="url(#goldGrad)"
    letter-spacing="6"
  >hairs</text>
  <line x1="228" y1="118" x2="496" y2="118" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Tagline -->
  <text
    x="260"
    y="145"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    font-weight="400"
    fill="#C9956A"
    letter-spacing="3.5"
    text-anchor="middle"
  >CROWNING WOMEN WITH CONFIDENCE</text>

  <!-- Heart -->
  <text
    x="260"
    y="162"
    font-size="12"
    fill="#C9956A"
    text-anchor="middle"
  >♥</text>
</svg>
